
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOCTALE</title>
  <meta name="description" content="Login or create your MOCTALE account to book movie tickets instantly.">
  <link rel="stylesheet" href="client-style.css">
</head>

<body>

  <div class="login-page" id="login-page">

    <div style="position:fixed;top:-100px;right:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(232,23,58,0.12),transparent 70%);pointer-events:none;z-index:0"></div>

    <div style="position:fixed;bottom:-120px;left:-80px;width:350px;height:350px;background:radial-gradient(circle,rgba(255,107,53,0.08),transparent 70%);pointer-events:none;z-index:0"></div>

    <div class="login-box fade-in" id="login-box" style="position:relative;z-index:1">

      <div class="login-brand">
        <a href="index.html" id="login-logo">
          <div class="logo-text">MOCTALE</div>
        </a>
        <p>🎬 Your Cinema Booking Partner</p>
      </div>

      <div class="login-tabs" id="login-tabs">
        <button class="login-tab active" id="tab-login" type="button" onclick="switchTab('login')">Login</button>
        <button class="login-tab" id="tab-register" type="button" onclick="switchTab('register')">Register</button>
      </div>

      <!-- LOGIN FORM -->
      <div id="login-form-wrap">

        <form id="login-form" onsubmit="handleLogin(event)" novalidate>

          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input class="form-control" type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
            <div class="form-hint" id="login-email-hint"></div>
          </div>

          <div class="form-group">

            <label class="form-label" for="login-password" style="display:flex;justify-content:space-between">
              <span>Password</span>
              <a href="#" style="color:var(--primary);font-size:12px;font-weight:600" id="forgot-pw-btn" onclick="forgotPw(event)">Forgot Password?</a>
            </label>

            <div class="pw-field-wrap">
              <input class="form-control pw-input" type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password">

              <button type="button" class="pw-toggle" id="toggle-pw" onclick="togglePw('login-password','toggle-pw')" aria-label="Show password">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>

            <div class="form-hint" id="login-pw-hint"></div>
          </div>

          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <input type="checkbox" id="remember-me" style="accent-color:var(--primary);width:15px;height:15px">
            <label for="remember-me" style="font-size:13px;color:var(--text-muted);cursor:pointer">Remember me for 30 days</label>
          </div>

          <button type="submit" class="btn btn-primary" id="login-submit-btn" style="width:100%;justify-content:center;padding:15px;font-size:16px;margin-top:16px">
            🎬 Login to MOCTALE
          </button>

        </form>

        <p class="login-footer-note">
          Don't have an account? <a href="#" onclick="switchTab('register')">Create one free →</a>
        </p>

      </div>

      <!-- REGISTER FORM -->
      <div id="register-form-wrap" style="display:none">

        <form id="register-form" onsubmit="handleRegister(event)" novalidate>

          <div class="form-row">

            <div class="form-group">
              <label class="form-label" for="reg-first">First Name</label>
              <input class="form-control" type="text" id="reg-first" placeholder="Viraj">
              <div class="form-hint" id="reg-first-hint"></div>
            </div>

            <div class="form-group">
              <label class="form-label" for="reg-last">Last Name</label>
              <input class="form-control" type="text" id="reg-last" placeholder="Saresa">
              <div class="form-hint" id="reg-last-hint"></div>
            </div>

          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input class="form-control" type="email" id="reg-email" placeholder="you@example.com" autocomplete="email">
            <div class="form-hint" id="reg-email-hint"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-phone">Phone Number</label>
            <input class="form-control" type="tel" id="reg-phone" placeholder="9876543210">
            <div class="form-hint" id="reg-phone-hint"></div>
          </div>

          <div class="form-group">

            <label class="form-label" for="reg-password">Create Password</label>

            <div class="pw-field-wrap">
              <input class="form-control pw-input" type="password" id="reg-password" placeholder="Enter your password" autocomplete="new-password">

              <button type="button" onclick="togglePw('reg-password','toggle-reg-pw')" class="pw-toggle" id="toggle-reg-pw" aria-label="Show password">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>

            <div class="form-hint" id="reg-password-hint"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm">Confirm Password</label>
            <input class="form-control" type="password" id="reg-confirm" placeholder="Re-enter password" autocomplete="new-password">
            <div class="form-hint" id="reg-confirm-hint"></div>
          </div>

          <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:8px">
            <input type="checkbox" id="agree-terms" style="accent-color:var(--primary);width:15px;height:15px;margin-top:2px;flex-shrink:0">

            <label for="agree-terms" style="font-size:13px;color:var(--text-muted);cursor:pointer;line-height:1.5">
              I agree to the
              <a href="#" style="color:var(--primary)">Terms of Service</a>
              and
              <a href="#" style="color:var(--primary)">Privacy Policy</a>
            </label>
          </div>

          <button type="submit" class="btn btn-primary" id="register-submit-btn" style="width:100%;justify-content:center;padding:15px;font-size:16px;margin-top:12px">
            Create My Account
          </button>

        </form>

        <p class="login-footer-note">
          Already have an account? <a href="#" onclick="switchTab('login')">Login here →</a>
        </p>

      </div>

    </div>
  </div>

  <div class="toast-wrap" id="toast-wrap"></div>

  <script>

    function switchTab(tab) {

      const isLogin = tab === 'login';

      document.getElementById('tab-login').classList.toggle('active', isLogin);
      document.getElementById('tab-register').classList.toggle('active', !isLogin);

      document.getElementById('login-form-wrap').style.display = isLogin ? '' : 'none';
      document.getElementById('register-form-wrap').style.display = isLogin ? 'none' : '';

    }


    function togglePw(inputId, btnId) {

      const input = document.getElementById(inputId);
      const isHidden = input.type === 'password';

      input.type = isHidden ? 'text' : 'password';

      const btn = document.getElementById(btnId);

      btn.innerHTML = isHidden
        ? `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
        : `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;

    }


    // SHARED PASSWORD RULES (used by login + register)
    // required, no spaces, 8-20 chars, 1 uppercase, 1 lowercase, 1 number, 1 special char, not like email

    function getPasswordError(pw, email) {

      if (!pw) return '✗ Password is required.';
      if (/\s/.test(pw)) return '✗ Password must not contain spaces.';
      if (pw.length < 8) return '✗ Password must be at least 8 characters.';
      if (pw.length > 20) return '✗ Password must be at most 20 characters.';
      if (!/[A-Z]/.test(pw)) return '✗ Password must contain at least 1 uppercase letter.';
      if (!/[a-z]/.test(pw)) return '✗ Password must contain at least 1 lowercase letter.';
      if (!/[0-9]/.test(pw)) return '✗ Password must contain at least 1 number.';
      if (!/[^A-Za-z0-9]/.test(pw)) return '✗ Password must contain at least 1 special character (e.g. @ # $ !).';

      const user = (email || '').split('@')[0].toLowerCase();

      if (email && (pw.toLowerCase() === email.toLowerCase() || (user.length >= 3 && pw.toLowerCase().includes(user)))) {
        return '✗ Password must not be similar to your email.';
      }

      return '';

    }


    // LOGIN FORM VALIDATION

    function handleLogin(e) {

      e.preventDefault();

      const email = document.getElementById('login-email').value.trim();
      const pw = document.getElementById('login-password').value;

      const emailHint = document.getElementById('login-email-hint');
      const pwHint = document.getElementById('login-pw-hint');

      emailHint.textContent = '';
      pwHint.textContent = '';

      emailHint.style.color = '#ef4444';
      pwHint.style.color = '#ef4444';

      let valid = true;

      // Email validation

      if (!email) {

        emailHint.textContent = '✗ Email is required.';
        valid = false;

      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {

        emailHint.textContent = '✗ Enter a valid email address (e.g. you@gmail.com).';
        valid = false;

      }

      // Password validation (required, length, pattern, not like email)

      const loginPwErr = getPasswordError(pw, email);

      if (loginPwErr) {

        pwHint.textContent = loginPwErr;
        valid = false;

      }

      // All fields empty -> general message
      if (!email && !pw) {
        showToast('✗ All fields are required.', 'error');
      }

      if (!valid) return;

      const btn = document.getElementById('login-submit-btn');

      btn.textContent = '⏳ Logging in…';
      btn.disabled = true;

      setTimeout(() => {

        localStorage.setItem('moctaleUser', JSON.stringify({
          first: 'Viraj',
          last: '',
          email: email
        }));

        showToast('✅ Welcome back to MOCTALE!', 'success');

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);

      }, 1200);

    }


    // REGISTER FORM VALIDATION

    function handleRegister(e) {

      e.preventDefault();

      const first = document.getElementById('reg-first').value.trim();
      const last = document.getElementById('reg-last').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const pw = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;
      const agreed = document.getElementById('agree-terms').checked;

      const hintIds = [
        'reg-first-hint',
        'reg-last-hint',
        'reg-email-hint',
        'reg-phone-hint',
        'reg-password-hint',
        'reg-confirm-hint'
      ];

      hintIds.forEach(id => {

        const hint = document.getElementById(id);

        hint.textContent = '';
        hint.style.color = '#ef4444';

      });

      let valid = true;

      // First name validation

      if (!first) {

        document.getElementById('reg-first-hint').textContent =
          '✗ First name is required.';

        valid = false;

      }

      // Email validation

      if (!email) {

        document.getElementById('reg-email-hint').textContent =
          '✗ Email is required.';

        valid = false;

      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {

        document.getElementById('reg-email-hint').textContent =
          '✗ Enter a valid email address (e.g. you@gmail.com).';

        valid = false;

      }

      // Phone number validation

      const phoneHint = document.getElementById('reg-phone-hint');

      const cleanPhone = phone.replace(/\D/g, '');

      const phoneDigits =
        cleanPhone.length === 12 && cleanPhone.startsWith('91')
          ? cleanPhone.slice(2)
          : cleanPhone;

      if (!phone) {

        phoneHint.textContent = '✗ Phone number is required.';
        valid = false;

      } else if (!/^\d{10}$/.test(phoneDigits)) {

        phoneHint.textContent = '✗ Phone number must be exactly 10 digits.';
        valid = false;

      }

      // Password validation (required, length, pattern, not like email)

      const regPwErr = getPasswordError(pw, email);

      if (regPwErr) {

        document.getElementById('reg-password-hint').textContent = regPwErr;
        valid = false;

      }

      // Confirm password validation

      if (!confirm) {

        document.getElementById('reg-confirm-hint').textContent =
          '✗ Please confirm your password.';

        valid = false;

      } else if (pw !== confirm) {

        document.getElementById('reg-confirm-hint').textContent =
          '✗ Passwords do not match.';

        valid = false;

      }

      // Terms and conditions validation

      if (!agreed) {

        if (first || last || email || phone || pw || confirm) {
          showToast('✗ Please accept Terms & Conditions to continue.', 'error');
        }

        valid = false;

      }

      // ===== NEW VALIDATIONS (register) =====

      // NEW 2: First name – letters only, 2–30 chars
      const firstHint = document.getElementById('reg-first-hint');
      if (first && !firstHint.textContent && !/^[A-Za-z][A-Za-z\s'-]{1,29}$/.test(first)) {
        firstHint.textContent = '✗ First name must be 2–30 letters only (no numbers or symbols).';
        valid = false;
      }

      // Last name – required, letters only, max 30 chars
      const lastHint = document.getElementById('reg-last-hint');
      if (!last) {
        lastHint.textContent = '✗ Last name is required.';
        valid = false;
      } else if (!/^[A-Za-z][A-Za-z\s'-]{0,29}$/.test(last)) {
        lastHint.textContent = '✗ Last name must contain letters only (max 30).';
        valid = false;
      }

      // NEW 4: Phone must start with 6, 7, 8 or 9 (valid Indian mobile)
      if (phone && !phoneHint.textContent && !/^[6-9]/.test(phoneDigits)) {
        phoneHint.textContent = '✗ Phone number must start with 6, 7, 8 or 9.';
        valid = false;
      }

      // All fields empty -> general message
      if (!first && !last && !email && !phone && !pw && !confirm && !agreed) {
        showToast('✗ All fields are required.', 'error');
      }

      // Stop form submission if any validation fails

      if (!valid) return;

      const btn = document.getElementById('register-submit-btn');

      btn.textContent = '⏳ Creating account…';
      btn.disabled = true;

      setTimeout(() => {

        localStorage.setItem('moctaleUser', JSON.stringify({
          first: first,
          last: last,
          email: email
        }));

        showToast('🎉 Account created! Welcome to MOCTALE!', 'success');

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1200);

      }, 1400);

    }


    // FORGOT PASSWORD

    function forgotPw(e) {

      e.preventDefault();

      const email = document.getElementById('login-email').value.trim();

      if (!email) {

        showToast('Enter your email first', 'error');
        return;

      }

      showToast('📧 Reset link sent to ' + email, 'success');

    }


    // TOAST MESSAGE

    function showToast(msg, type = 'info') {

      const wrap = document.getElementById('toast-wrap');

      const toast = document.createElement('div');

      toast.className = `toast ${type}`;

      const icons = {
        success: '✅',
        error: '❌',
        info: 'ℹ️'
      };

      toast.innerHTML = `
        <span class="toast-icon">${icons[type] || 'ℹ️'}</span>
        <span class="toast-msg">${msg}</span>
      `;

      wrap.appendChild(toast);

      setTimeout(() => toast.remove(), 4000);

    }

  </script>

</body>
</html>
